modules:
  # used by the blackbox scrape job in ../prometheus.nix
  http_2xx:
    prober: http
    timeout: 10s
    http:
      # the homelab has no working v6 path to the internet; avoid the failed
      # attempt before every probe
      preferred_ip_protocol: ip4
      follow_redirects: true
      valid_status_codes: [ 200 ]
